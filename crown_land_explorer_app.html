<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ontario Crown Land Explorer</title>
    
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f8f0;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 14px;
        }
        
        .info-panel h3 {
            margin-top: 0;
            color: #2d5a2d;
        }
        
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        
        .btn {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background: #45a049;
        }
        
        .status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
        
        .legend {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            font-size: 12px;
        }
        
        .legend h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border: 1px solid #333;
            border-radius: 50%;
        }
        
        .popup-content {
            max-width: 300px;
        }
        
        .popup-content h4 {
            margin: 0 0 10px 0;
            color: #2d5a2d;
        }
        
        .popup-content .info-row {
            margin: 5px 0;
        }
        
        .popup-content .info-label {
            font-weight: bold;
            color: #666;
        }
        
        /* Custom marker styles */
        .crown-land-marker {
            background: none !important;
            border: none !important;
            font-size: 24px;
            text-align: center;
            line-height: 24px;
        }
        
        .user-location-marker {
            background: none !important;
            border: none !important;
            font-size: 20px;
            text-align: center;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="info-panel">
        <h3>🏞️ Ontario Crown Land Explorer</h3>
        <p>Click on any green circle to see Crown land details and get navigation directions.</p>
        <p><strong>Your Location:</strong> <span id="user-location">Click "Find My Location"</span></p>
        <p><strong>Status:</strong> <span id="data-status">Crown land data loaded</span></p>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="findMyLocation()">📍 Find My Location</button>
        <button class="btn" onclick="showClosestArea()">🎯 Closest Area</button>
        <button class="btn" onclick="showAllAreas()">🗺️ Show All Areas</button>
    </div>
    
    <div class="status" id="status">
        4 Crown land areas loaded - Click green circles for details
    </div>
    
    <div class="legend">
        <h4>Legend</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #4CAF50;"></div>
            <span>General Use Crown Land</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF0000;"></div>
            <span>Your Location</span>
        </div>
    </div>

    <script>
        console.log("🚀 Crown Land Explorer starting...");
        
        // Initialize map centered on Ottawa
        const map = L.map('map').setView([45.4215, -75.6972], 9);
        
        // Global variables
        let userLocation = null;
        let userMarker = null;
        let crownLandMarkers = [];
        
        // Add base map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Verified Crown land data from our analysis
        const crownLandAreas = [
            {
                name: "Area E - General Use",
                lat: 45.1223,
                lon: -76.0016,
                driveTime: 51,
                driveDistance: 53.6,
                straightDistance: 40.9,
                area: 896,
                activities: ["Camping (up to 21 days)", "Fishing with license", "Hunting with license", "Hiking", "Photography", "Canoeing/Kayaking"]
            },
            {
                name: "Kemptville District Crown Lands",
                lat: 44.8895,
                lon: -75.5249,
                driveTime: 63,
                driveDistance: 78.1,
                straightDistance: 60.7,
                area: 19719,
                activities: ["Camping (up to 21 days)", "Fishing with license", "Hunting with license", "Hiking", "ATV use where permitted"]
            },
            {
                name: "Area A - General Use",
                lat: 45.1585,
                lon: -76.4353,
                driveTime: 72,
                driveDistance: 77.2,
                straightDistance: 64.9,
                area: 253239,
                activities: ["Camping (up to 21 days)", "Fishing with license", "Hunting with license", "Hiking", "Remote wilderness access"]
            },
            {
                name: "Area B - General Use",
                lat: 44.9742,
                lon: -76.2652,
                driveTime: 67,
                driveDistance: 77.7,
                straightDistance: 66.8,
                area: 288978,
                activities: ["Camping (up to 21 days)", "Fishing with license", "Hunting with license", "Hiking", "Wildlife viewing"]
            }
        ];
        
        // Function to calculate distance between two points
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        // Function to create navigation links
        function createNavigationLinks(lat, lon) {
            const googleMaps = `https://maps.google.com/?q=${lat},${lon}`;
            const waze = `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;
            const appleMaps = `http://maps.apple.com/?ll=${lat},${lon}`;
            
            return `
                <div style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
                    <strong>🧭 Navigate with:</strong><br>
                    <a href="${googleMaps}" target="_blank" style="display: inline-block; margin: 5px 0; color: #4285F4; text-decoration: none;">
                        🗺️ Google Maps
                    </a><br>
                    <a href="${waze}" target="_blank" style="display: inline-block; margin: 5px 0; color: #32C8FF; text-decoration: none;">
                        🚗 Waze
                    </a><br>
                    <a href="${appleMaps}" target="_blank" style="display: inline-block; margin: 5px 0; color: #007AFF; text-decoration: none;">
                        🍎 Apple Maps
                    </a>
                </div>
            `;
        }
        
        // Function to create Crown land markers
        function createCrownLandMarkers() {
            console.log("Creating Crown land markers...");
            
            // Clear existing markers
            crownLandMarkers.forEach(marker => map.removeLayer(marker));
            crownLandMarkers = [];
            
            crownLandAreas.forEach((area, index) => {
                console.log(`Adding marker ${index + 1}: ${area.name}`);
                
                // Calculate distance from user if available
                let userDistance = '';
                if (userLocation) {
                    const dist = calculateDistance(
                        userLocation.lat, userLocation.lng,
                        area.lat, area.lon
                    );
                    userDistance = `
                        <div class="info-row">
                            <span class="info-label">Distance from you:</span> ${dist.toFixed(1)} km
                        </div>
                    `;
                }
                
                // Create popup content
                const popupContent = `
                    <div class="popup-content">
                        <h4>🏞️ ${area.name}</h4>
                        
                        <div class="info-row">
                            <span class="info-label">Type:</span> General Use Crown Land
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Size:</span> ${area.area.toLocaleString()} hectares
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Drive time from Ottawa:</span> ~${area.driveTime} minutes (${Math.round(area.driveTime/60*10)/10} hours)
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Drive distance from Ottawa:</span> ${area.driveDistance} km
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Coordinates:</span> ${area.lat}, ${area.lon}
                        </div>
                        
                        ${userDistance}
                        
                        <div style="margin-top: 10px; font-size: 12px; color: #666;">
                            <strong>✅ Permitted Activities:</strong><br>
                            ${area.activities.map(activity => `• ${activity}`).join('<br>')}
                        </div>
                        
                        ${createNavigationLinks(area.lat, area.lon)}
                        
                        <div style="margin-top: 10px; font-size: 10px; color: #999; text-align: center;">
                            Verified data from spatial analysis
                        </div>
                    </div>
                `;
                
                // Create circle marker
                const marker = L.circleMarker([area.lat, area.lon], {
                    radius: 12,
                    fillColor: '#4CAF50',
                    color: 'white',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                
                // Bind popup
                marker.bindPopup(popupContent, {
                    maxWidth: 400,
                    className: 'crown-land-popup'
                });
                
                // Add hover effects
                marker.on('mouseover', function(e) {
                    this.setStyle({
                        radius: 15,
                        weight: 3
                    });
                    updateStatus(`Hovering: ${area.name} - Click for details`);
                });
                
                marker.on('mouseout', function(e) {
                    this.setStyle({
                        radius: 12,
                        weight: 2
                    });
                    updateStatus(`${crownLandAreas.length} Crown land areas loaded - Click green circles for details`);
                });
                
                // Store marker
                crownLandMarkers.push(marker);
            });
            
            console.log(`✅ Created ${crownLandMarkers.length} Crown land markers`);
            updateStatus(`${crownLandAreas.length} Crown land areas loaded - Click green circles for details`);
        }
        
        // Function to find user location
        function findMyLocation() {
            if (!navigator.geolocation) {
                alert('❌ Geolocation is not supported by this browser.');
                return;
            }
            
            updateStatus('🔍 Getting your location...');
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    userLocation = { lat, lng };
                    console.log(`📍 User location: ${lat}, ${lng}`);
                    
                    // Remove existing user marker
                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }
                    
                    // Add user location marker
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#FF0000',
                        color: 'white',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 1
                    }).addTo(map);
                    
                    userMarker.bindPopup(`
                        <div>
                            <h4>📍 Your Current Location</h4>
                            <p><strong>Coordinates:</strong> ${lat.toFixed(4)}, ${lng.toFixed(4)}</p>
                            <p><strong>Accuracy:</strong> ±${Math.round(position.coords.accuracy)} meters</p>
                        </div>
                    `);
                    
                    // Update UI
                    document.getElementById('user-location').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    updateStatus('📍 Location found! Crown land distances updated.');
                    
                    // Recreate markers with distance info
                    createCrownLandMarkers();
                    
                    // Center on user location
                    map.setView([lat, lng], 10);
                },
                (error) => {
                    let message;
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            message = 'Location access denied. Please allow location access and try again.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            message = 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            message = 'Location request timed out.';
                            break;
                        default:
                            message = 'An unknown error occurred.';
                            break;
                    }
                    updateStatus(`❌ ${message}`);
                    alert(`Cannot get your location: ${message}`);
                }
            );
        }
        
        // Function to show closest area
        function showClosestArea() {
            const closest = crownLandAreas[0]; // Area E is closest to Ottawa
            map.setView([closest.lat, closest.lon], 12);
            
            // Find and open the popup for closest area
            const closestMarker = crownLandMarkers[0];
            if (closestMarker) {
                closestMarker.openPopup();
            }
            
            updateStatus(`🎯 Showing closest: ${closest.name} - ${closest.driveTime} min from Ottawa`);
        }
        
        // Function to show all areas
        function showAllAreas() {
            // Create bounds that include all Crown land areas
            const group = new L.featureGroup(crownLandMarkers);
            map.fitBounds(group.getBounds().pad(0.1));
            updateStatus(`🗺️ Showing all ${crownLandAreas.length} Crown land areas`);
        }
        
        // Function to update status
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(`Status: ${message}`);
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            console.log("🚀 DOM Content Loaded - Initializing app...");
            
            // Create Crown land markers immediately
            createCrownLandMarkers();
            
            // Add scale control
            L.control.scale().addTo(map);
            
            // Initial status
            setTimeout(() => {
                updateStatus('✅ Ready! Click "Find My Location" for GPS or green circles for Crown land details');
            }, 1000);
            
            console.log("✅ App initialization complete");
        });
        
    </script>
</body>
</html>
